worker_processes 1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Docker's embedded DNS changes a service address when its container is
  # replaced. Using a variable makes nginx re-resolve `api` instead of keeping
  # the address it learned when the Web container started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  # 静态资源缓存
  map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
  }

  server {
    listen 80 default_server;
    server_name _;
    expires $expires;

    # SPA：静态文件 + history fallback
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # /api 反代到 api 容器（容器内主机名为 docker-compose 里的服务名 `api`）
    location /api/ {
      set $api_upstream api:4000;
      # Do not add a URI suffix here: with a variable upstream nginx would
      # replace the original /api/... path instead of preserving it.
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
