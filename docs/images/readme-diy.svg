      .ink{fill:none;stroke:#dc6555;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .muted{fill:none;stroke:#b8ada0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
