      .ink{fill:none;stroke:#dc6555;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .muted{fill:none;stroke:#b9afa3;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
